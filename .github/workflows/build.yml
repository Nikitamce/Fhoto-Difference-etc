name: Build PhotoCheck Portable HTML

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocheck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare portable HTML
        shell: bash
        run: |
          test -s dist/index.html
          cp dist/index.html PhotoCheck_Portable.html
          test -s PhotoCheck_Portable.html
          echo "## PhotoCheck build" >> "$GITHUB_STEP_SUMMARY"
          echo "Portable HTML created successfully: `PhotoCheck_Portable.html`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portable HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCheck-Portable-HTML-${{ github.sha }}
          path: PhotoCheck_Portable.html
          if-no-files-found: error
          retention-days: 14
